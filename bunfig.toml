# Bun configuration for development and `bun run ci` (not loaded by the compiled sapi binary:
# release builds use --no-compile-autoload-bunfig and --no-compile-autoload-dotenv).

[install]
# Lockfile changes must be deliberate: `bun run ci` runs `bun install --frozen-lockfile`.
exact = true
# Refuse package versions published less than 7 days ago (ARI-42 SDLC-6). Seconds; Bun 1.3+.
minimumReleaseAge = 604800

[test]
coverage = false
