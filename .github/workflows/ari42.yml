# ARI-42 gate (added by the ARI-42 installer).
#
# Fails the build unless every ARI-42 requirement that applies to THIS project is met.
# The scope comes from ARI42.md, cross-checked against the agent components the scanner detects:
# a requirement can only be marked N/A with a reason, and a detected requirement can only be
# taken out of scope by a named person in the Exceptions table.
#
# Catching up on an existing project? Add --report to the verify step: it prints the same
# result without failing, so you can merge the record first and turn the gate on when ready.
name: ARI-42 gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ari42:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No high-severity unsafe agent code
        run: python3 .agents/skills/ari42/scripts/ari42_scan.py check . --fail-on high

      # Report mode until the 0.1 release (plan, Phase 5): prints every unmet requirement without
      # failing the build. Remove --report to make the gate blocking.
      - name: Every requirement that applies here is met with evidence
        run: python3 .agents/skills/ari42/scripts/ari42_scan.py verify . --report
